[project]
name = "eyeclean-client"
version = "0.2.0"
description = "Dependency-free client for the EyeClean engine: run jobs as a subprocess, stream progress, read outputs"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
exr = ["numpy>=1.21"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["eyeclean_client"]
