<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" width="1100" height="620" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <title>EyeClean architecture: two GPU passes over the clip</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#51606d"/></marker>
    <style>
      .box{fill:#ffffff;stroke:#9fb3c4;stroke-width:1.5}
      .gpu{fill:#eaf4fb;stroke:#2f6f9f;stroke-width:1.6}
      .net{fill:#fff4e0;stroke:#d98e04;stroke-width:1.6}
      .safe{fill:#e8f6ec;stroke:#2e8b57;stroke-width:1.8}
      .t{font-size:14px;fill:#24323d;font-weight:600}
      .s{font-size:11.5px;fill:#566673}
      .h{font-size:16px;fill:#2f6f9f;font-weight:700}
      .l{stroke:#51606d;stroke-width:1.6;fill:none;marker-end:url(#a)}
    </style>
  </defs>
  <rect width="1100" height="620" rx="18" fill="#f7f9fb"/>
  <text x="30" y="40" class="h">input</text>
  <rect x="30" y="56" width="200" height="66" rx="10" class="gpu"/>
  <text x="130" y="82" text-anchor="middle" class="t">decode on the GPU</text>
  <text x="130" y="100" text-anchor="middle" class="s">NVDEC video · EXR (none/ZIP/ZIPS)</text>
  <text x="130" y="114" text-anchor="middle" class="s">+ sidecar / flags: colour, range, fps</text>
  <path d="M230 89H280" class="l"/>
  <rect x="284" y="56" width="210" height="66" rx="10" class="gpu"/>
  <text x="389" y="82" text-anchor="middle" class="t">reference B_t (FP32)</text>
  <text x="389" y="100" text-anchor="middle" class="s">one recorded transform to linear</text>
  <text x="389" y="114" text-anchor="middle" class="s">ACEScg or linear Rec.709</text>

  <text x="30" y="170" class="h">pass 1 · analysis (whole clip)</text>
  <rect x="30" y="186" width="160" height="70" rx="10" class="net"/>
  <text x="110" y="212" text-anchor="middle" class="t">face detector</text><text x="110" y="230" text-anchor="middle" class="s">S3FD</text>
  <path d="M190 221H222" class="l"/>
  <rect x="226" y="186" width="160" height="70" rx="10" class="net"/>
  <text x="306" y="212" text-anchor="middle" class="t">landmarks</text><text x="306" y="230" text-anchor="middle" class="s">FAN 68-point → eye ROIs</text>
  <path d="M386 221H418" class="l"/>
  <rect x="422" y="186" width="170" height="70" rx="10" class="net"/>
  <text x="507" y="212" text-anchor="middle" class="t">Guard refine</text><text x="507" y="230" text-anchor="middle" class="s">iris centre, diameter,</text><text x="507" y="244" text-anchor="middle" class="s">open-eye + reflection presence</text>
  <path d="M592 221H624" class="l"/>
  <rect x="628" y="186" width="200" height="70" rx="10" class="box"/>
  <text x="728" y="212" text-anchor="middle" class="t">tracks + cuts</text><text x="728" y="230" text-anchor="middle" class="s">per-eye tracks, shot cuts,</text><text x="728" y="244" text-anchor="middle" class="s">smoothed over the clip</text>
  <path d="M389 122V150H110V182" class="l"/>

  <text x="30" y="306" class="h">pass 2 · render (fresh decode, frame by frame)</text>
  <rect x="30" y="322" width="170" height="84" rx="10" class="gpu"/>
  <text x="115" y="348" text-anchor="middle" class="t">eye crop</text><text x="115" y="366" text-anchor="middle" class="s">256 px, iris-scaled, rotated;</text><text x="115" y="380" text-anchor="middle" class="s">restorer input softened</text><text x="115" y="394" text-anchor="middle" class="s">0.5 native px</text>
  <path d="M200 364H232" class="l"/>
  <rect x="236" y="322" width="170" height="84" rx="10" class="net"/>
  <text x="321" y="348" text-anchor="middle" class="t">GuardTX masks</text><text x="321" y="366" text-anchor="middle" class="s">ocular · iris · pupil ·</text><text x="321" y="380" text-anchor="middle" class="s">protected (lids, lashes) ·</text><text x="321" y="394" text-anchor="middle" class="s">reflection · clipped</text>
  <path d="M406 364H438" class="l"/>
  <rect x="442" y="322" width="186" height="84" rx="10" class="net"/>
  <text x="535" y="348" text-anchor="middle" class="t">EyeRestoreTX</text><text x="535" y="366" text-anchor="middle" class="s">57.5M Restormer-style;</text><text x="535" y="380" text-anchor="middle" class="s">residual · support · conf ·</text><text x="535" y="394" text-anchor="middle" class="s">synth</text>
  <path d="M628 364H660" class="l"/>
  <rect x="664" y="322" width="190" height="84" rx="10" class="box"/>
  <text x="759" y="348" text-anchor="middle" class="t">gate → hard support H</text><text x="759" y="366" text-anchor="middle" class="s">reflection ∩ visible surface</text><text x="759" y="380" text-anchor="middle" class="s">∩ track validity ∩ max region;</text><text x="759" y="394" text-anchor="middle" class="s">any doubt → empty (abstain)</text>
  <path d="M728 256V290H115V318" class="l"/>
  <path d="M854 364H886" class="l"/>
  <rect x="890" y="322" width="180" height="84" rx="10" class="safe"/>
  <text x="980" y="348" text-anchor="middle" class="t">compositor</text><text x="980" y="366" text-anchor="middle" class="s">writes only inside H;</text><text x="980" y="380" text-anchor="middle" class="s">checks every frame: bits</text><text x="980" y="394" text-anchor="middle" class="s">outside H = reference</text>

  <text x="30" y="456" class="h">outputs (eyeclean.process/1)</text>
  <path d="M980 406V440H560V466" class="l"/>
  <rect x="30" y="470" width="250" height="118" rx="10" class="box"/>
  <text x="155" y="496" text-anchor="middle" class="t">float EXR layers per eye</text>
  <text x="155" y="516" text-anchor="middle" class="s">patches/ signed correction (out − src)</text>
  <text x="155" y="532" text-anchor="middle" class="s">patches/*_replacement RGBA (straight α)</text>
  <text x="155" y="548" text-anchor="middle" class="s">masks/ hard · feather · synth · abstained</text>
  <text x="155" y="564" text-anchor="middle" class="s">uncertainty/ · optional master/ frames</text>
  <rect x="300" y="470" width="250" height="118" rx="10" class="box"/>
  <text x="425" y="496" text-anchor="middle" class="t">patches/index.json</text>
  <text x="425" y="516" text-anchor="middle" class="s">every tracked eye, every frame:</text>
  <text x="425" y="532" text-anchor="middle" class="s">status repaired | untouched + reasons,</text>
  <text x="425" y="548" text-anchor="middle" class="s">data windows, file paths</text>
  <rect x="570" y="470" width="250" height="118" rx="10" class="box"/>
  <text x="695" y="496" text-anchor="middle" class="t">RUN_REPORT.json</text>
  <text x="695" y="516" text-anchor="middle" class="s">model + SHA-256, resolved job, colour,</text>
  <text x="695" y="532" text-anchor="middle" class="s">preservation proof, GPU audit,</text>
  <text x="695" y="548" text-anchor="middle" class="s">source hashes before/after</text>
  <rect x="840" y="470" width="230" height="118" rx="10" class="box"/>
  <text x="955" y="496" text-anchor="middle" class="t">progress + previews</text>
  <text x="955" y="516" text-anchor="middle" class="s">JSON-lines events (eyeclean.progress/1)</text>
  <text x="955" y="532" text-anchor="middle" class="s">preview.mp4 / comparison.mp4</text>
  <text x="955" y="548" text-anchor="middle" class="s">(viewing copies, not masters)</text>
  <g font-size="11.5" fill="#566673">
    <rect x="600" y="30" width="14" height="14" rx="3" class="gpu"/><text x="620" y="42">GPU image op</text>
    <rect x="720" y="30" width="14" height="14" rx="3" class="net"/><text x="740" y="42">neural network</text>
    <rect x="850" y="30" width="14" height="14" rx="3" class="safe"/><text x="870" y="42">preservation guarantee</text>
  </g>
</svg>
